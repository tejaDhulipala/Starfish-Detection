# Frozen once it has a seed run: any change means a new config folder.
description: c06 (best.pt) fine-tuned 15 epochs with a 70/30 zoom mixture, 70% U(0.8, 1.2) + 30% U(1.2, 1.8) (median ~1.09, 15% above 1.5), instead of c13's uniform 0.8-1.8 (median 1.3), to keep c06's 35-80 px recall while learning c13's large close-ups. Training regime otherwise as c14 (mosaic and mixup off, AdamW lr 3e-5 to 1e-5, no warmup). Augmentation otherwise as c13 (rot90, flips, HSV off).
model: model_dev/c06_c05ft_grid493_3x2_seq20val_pos_aug/seed0/weights/best.pt  # warm start from c06
split: grid493_3x2_seq20val_pos  # made by src.data.make_grid_split --base seq20val_pos (min-visible 0.5, empty-frac 0.25)
fitness: f2             # per-epoch val computes F2; best.pt and early stopping follow it
val_imgsz: 3648         # full frames at 2.85x (3648x2080), the scale the tiles are trained at
val_batch: 4
rot90: 0.5              # exact quarter turn (src/train/rot90.py); with both flips gives all 8 orientations
scale_mix:              # zoom ~ mixture of uniforms [weight, lo, hi] (src/train/scale_mix.py); overrides train.scale's uniform draw
  - [0.7, 0.8, 1.2]     # near native size, c06's range
  - [0.3, 1.2, 1.8]     # zoomed-in tail: a 118 px train starfish (train max) reaches up to ~210 px

train:                  # passed straight to ultralytics model.train()
  imgsz: 1408           # 493 px tile -> 1408 = 2.856x (1405 rounded up to a multiple of 32)
  rect: false           # square tiles, square batches; mosaic and mixup need rect off
  epochs: 15
  patience: 15
  batch: 6              # set from the smoke test's GPU memory; gradients accumulate to nbs=64
  save_period: 1

  # c14's low-LR regime (no warmup), from c06 instead of c13.
  optimizer: AdamW
  lr0: 0.00003          # [0.01] as c14
  lrf: 0.33             # [0.01] ends at ~1e-5
  warmup_epochs: 0.0    # [3.0]
  warmup_bias_lr: 0.0   # [0.1] bias LR ramps up from 0 like the weights
  close_mosaic: 0       # [10] nothing to close: mosaic and mixup are off from the start

  # Augmentation (Ultralytics defaults in brackets)
  mosaic: 0.0           # [1.0] off for the whole run, as c14
  mixup: 0.0            # [0.0] off, as c14
  hsv_h: 0.0            # [0.015] color jitter off: color is a plausible cue for COTS vs coral
  hsv_s: 0.0            # [0.7]
  hsv_v: 0.0            # [0.4]
  degrees: 0.0          # [0.0] rot90 replaces c05's 10-degree rotation (exact boxes, no loosening)
  fliplr: 0.5           # [0.5]
  flipud: 0.5           # [0.0] starfish have no "up"
  scale: [0.8, 1.8]     # [0.5] overall zoom range; the draw itself comes from scale_mix above